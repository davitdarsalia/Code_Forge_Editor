[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8.1", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
anyhow = "1"
lsp-types = "0.97"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
portable-pty = "0.9"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dirs = "6"
flume = "0.12"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
nucleo-matcher = "0.3"
num_cpus = "1"
tree-sitter = "0.26"
tree-sitter-xml = "0.7"
tree-sitter-groovy = "0.1"
tree-sitter-properties = "0.3"
tree-sitter-objc = "3"
tree-sitter-ini = "1"
tree-sitter-batch = "0.11"
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.release.package."*"]
opt-level = "s"

[profile.release.package.tree-sitter]
opt-level = 3

[profile.release.package.nucleo-matcher]
opt-level = 3

[profile.release.package.ignore]
opt-level = 3

[profile.release.package.vt100]
opt-level = 3

[dev-dependencies]
gpui-pre-apple = "0.3.10"
