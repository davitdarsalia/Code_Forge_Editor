[package]
name = "forge"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8.1", features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
anyhow = "1"
# libgit2, vendored and without network features: status/index/commit run in-process.
# Network ops stay on the git CLI (see git.rs).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
portable-pty = "0.9"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
flume = "0.12"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
nucleo-matcher = "0.3"
num_cpus = "1"
tree-sitter = "0.26"
tree-sitter-xml = "0.7"
tree-sitter-groovy = "0.1"
tree-sitter-properties = "0.3"
tree-sitter-objc = "3"
tree-sitter-ini = "1"
tree-sitter-dart = "0.3"
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
